<script>

/* ---------- Fasta regler ---------- */

  payexpired:['Betalningstiden gick ut','neutral'], session_cancelled:['Passet inställt','bad']
};

/* ---------- Inställningar ---------- */

const CONFIG = {
  supabaseUrl: '',   // "Project URL" från Supabase → Settings → API
  supabaseKey: '',   // nyckeln "anon public" – den är gjord för att synas på hemsidan
  sms: false         // sätts till true när sms-tjänsten är inkopplad i Supabase
};
const SUPA_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';

/* ---------- Tillstånd ---------- */
const S = {
  ready:false, uid:null, email:null, isAdmin:false,
  sessions:{}, counts:{}, families:{}, loaded:{s:false,t:false,f:false}, fresh:false, slow:false, err:null,
  route:{name:'start'}, filter:'alla', ui:{}, drafts:{}, busy:false, flash:null, keepFlash:false
};
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function hm(d){ return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function loadScript(src){ return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('Kunde inte ladda ' + src)); document.head.appendChild(el); }); }
function normPhone(p){ let x = String(p || '').replace(/[\s\-()]/g, ''); if (x.indexOf('00') === 0) x = '+' + x.slice(2); else if (x.indexOf('0') === 0) x = '+46' + x.slice(1); return x; }

/* ---------- Hjälpfunktioner ---------- */
const DAYS = ['sön','mån','tis','ons','tor','fre','lör'];
const DAYS_L = ['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'];
const MON = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
const MON_L = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function kr(n){ return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' kr'; }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function fDay(ms){ const d = new Date(ms); return cap(DAYS[d.getDay()]) + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
function fDayLong(ms){ const d = new Date(ms); return cap(DAYS_L[d.getDay()]) + ' ' + d.getDate() + ' ' + MON_L[d.getMonth()]; }
function fTime(ms){ const d = new Date(ms); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function fWhen(ms){ return fDay(ms) + ' kl. ' + fTime(ms); }
function startOf(s){ const t = new Date(String(s.date) + 'T' + String(s.time) + ':00').getTime(); return isNaN(t) ? 0 : t; }
function ageOf(by){ return by ? (new Date().getFullYear() - Number(by)) + ' år' : ''; }
function rid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function chip(label, tone){ return '<span class="chip t-' + tone + '">' + esc(label) + '</span>'; }
function typeTag(t){ return '<span class="chip ty-' + t + '">' + TYPES[t].short + '</span>'; }
function isLoaded(){ return S.loaded.s && S.loaded.t && S.loaded.f; }
function me(){ return S.uid ? S.families[S.uid] || null : null; }
function myB(bid){ const f = me(); return f && f.bookings ? f.bookings[bid] || null : null; }
function activePlayers(fam){ return Object.entries((fam && fam.players) || {}).filter(([, p]) => p && !p.removed).sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0)); }
function userErr(text){ const e = new Error(text); e.userMsg = text; return e; }
function errText(e){
  if (e && e.userMsg) return e.userMsg;
  const c = e && e.code;
  if (c === 'invalid_argument') return 'Det gick inte att spara. Du kanske saknar behörighet att ändra här – be den som delade sidan om behörighet.';
  if (c === 'quota_exceeded') return 'Databasen är full. Ta bort gamla testpass och försök igen.';
  if (c === 'resource_exhausted') return 'För många ändringar på kort tid. Vänta en stund och försök igen.';
  if (c === 'revoked') return 'Din åtkomst till sidan har ändrats. Ladda om sidan.';
  return 'Något gick fel. Försök igen.';
}
function flash(text, tone){ S.flash = {text, tone: tone || 'ok'}; }
function flashNext(text, tone){ flash(text, tone); S.keepFlash = true; }

/* ---------- Platser och status ---------- */
function counts(x, now){
  if (x.st === 'reserved') return (x.hold || 0) > now;
  if (x.st === 'approved') return !(x.payBy && x.payBy < now);
  return x.st === 'pending_review' || x.st === 'confirmed';
}
function sessionStats(sid){
  const s = S.sessions[sid], c = S.counts[sid] || {used:0, confirmed:0, pending:0};
  const max = s ? (Number(s.max) || TYPES[s.type].max) : 0;
  return {used: c.used, confirmed: c.confirmed, pending: c.pending, max, free: Math.max(0, max - c.used)};
}
function sessionState(sid, s, now){
  const st = startOf(s), stats = sessionStats(sid, now);
  if (s.status === 'cancelled') return {code:'cancelled', label:'Inställt', tone:'bad', stats};
  if (now >= st) return {code:'past', label:'Har varit', tone:'neutral', stats};
  if (now >= st - BOOK_CLOSE) return {code:'closed', label:'Bokningen stängd', tone:'neutral', stats};
  if (stats.free <= 0) return {code:'full', label:'Fullbokat', tone:'neutral', stats};
  return {code:'open', label: s.type === 'ind' ? 'Ledig' : stats.free + ' av ' + stats.max + ' platser kvar', tone:'ok', stats};
}
function minNote(s, stats, now){
  if (s.type === 'ind' || s.status === 'cancelled') return null;
  const min = TYPES[s.type].min, st = startOf(s);
  if (s.checked === 'ok') return {text:'Blir av', tone:'ok'};
  if (now >= st - CHECK_LIMIT && stats.confirmed < min) return {text:'Ställs in – för få spelare', tone:'bad'};
  return {text: stats.confirmed + ' bekräftade · minst ' + min + ' krävs', tone:'muted'};
}
function effStatus(b, now){
  let st = b.status;
  if (st === 'reserved' && !((b.holdUntil || 0) > now)) st = 'expired';
  if (st === 'approved' && b.payBy && b.payBy < now) st = 'payexpired';
  const s = S.sessions[b.sid];
  if (s && s.status === 'cancelled' && (ACTIVE.indexOf(st) >= 0 || st === 'expired' || st === 'payexpired')) st = 'session_cancelled';
  return st;
}
function money(b){
  const paid = (b.pay && b.pay.status === 'verified') ? Number(b.pay.amount) || 0 : 0;
  let refPending = 0, refDone = 0;
  Object.values(b.refunds || {}).forEach(r => { if (!r) return; if (r.status === 'verified') refDone += Number(r.amount) || 0; else refPending += Number(r.amount) || 0; });
  return {paid, refPending, refDone, remaining: paid - refPending - refDone};
}
function payStatus(b){
  const m = money(b);
  if (m.refPending > 0) return ['Återbetalning pågår · ' + kr(m.refPending), 'info'];
  if (m.refDone > 0 && m.remaining <= 0) return ['Återbetald · ' + kr(m.refDone), 'ok'];
  if (m.paid > 0 && m.refDone > 0) return ['Betald · ' + kr(m.refDone) + ' återbetalt', 'ok'];
  if (m.paid > 0 && b.lateCancel && b.status === 'cancelled') return ['Betald · ingen återbetalning', 'neutral'];
  if (m.paid > 0) return ['Betald · ' + kr(m.paid), 'ok'];
  if (b.pay && b.pay.status === 'waiting') return ['Väntar på Swish', 'info'];
  return ['Inte betald', 'neutral'];
}
function sortedSessions(){
  return Object.entries(S.sessions).map(([id, s]) => ({id, s, st: startOf(s)})).filter(x => x.st && TYPES[x.s.type]).sort((a, b) => a.st - b.st);
}
function upcomingAll(now){ return sortedSessions().filter(x => x.st + H > now && x.st < now + 120 * 24 * H); }
function allBookings(){
  const out = [];
  for (const fu in S.families){
    const fam = S.families[fu] || {};
    for (const bid in (fam.bookings || {})) out.push({fu, bid, b: fam.bookings[bid], fam});
  }
  return out;
}

/* ---------- Kundens val ---------- */
function eligibleFor(sid){
  const fam = me(); if (!fam) return [];
  const now = Date.now(), booked = new Set();
  Object.values(fam.bookings || {}).forEach(b => { if (b && b.sid === sid && ACTIVE.indexOf(effStatus(b, now)) >= 0) (b.players || []).forEach(p => booked.add(p)); });
  return activePlayers(fam).map(([pid]) => pid).filter(pid => !booked.has(pid));
}
function effectiveSel(sid, elig){
  if (S.ui.selSid === sid) return (S.ui.sel || []).filter(p => elig.indexOf(p) >= 0);
  return elig.length === 1 ? [elig[0]] : [];
}
function moveTargets(b, now){
  return sortedSessions().filter(x => x.id !== b.sid && x.s.type === b.type && x.s.status !== 'cancelled' && x.st - CANCEL_LIMIT > now && sessionState(x.id, x.s, now).stats.free >= b.n);
}

/* ---------- Bokning och övriga åtgärder (via databasen) ---------- */
function preBook(sid){
  const s = S.sessions[sid]; const now = Date.now();
  if (!s || sessionState(sid, s, now).code !== 'open') throw userErr('Passet går inte att boka längre.');
  const inline = document.getElementById('newp-form');
  if (inline){ if (!me() || !me().account) readGuest(); readPlayer(new FormData(inline)); }
  const wd = S.drafts['wish-' + sid] || {};
  const wish = {mode: wd.wm === 'self' ? 'self' : 'abbe', goals: wd.wm === 'self' ? [].concat(wd.wg || []).map(String) : [], note: String(wd.wn || '').trim().slice(0, 300)};
  if (wish.mode === 'self' && !wish.goals.length && !wish.note) throw userErr('Välj vad ni vill träna på, eller låt Abbe välja.');
  if (!S.ui.terms) throw userErr('Godkänn bokningsvillkoren först.');
  return {s, inline, wish};
}
async function doBook(sid){
  const {s, inline, wish} = preBook(sid);
  const sel = inline ? [await saveInlinePlayer()] : effectiveSel(sid, eligibleFor(sid));
  if (!sel.length || !sel[0]) throw userErr('Välj minst en spelare.');
  if (s.type === 'ind' && sel.length > 1) throw userErr('Individuell träning gäller en spelare.');
  const bid = await B.book(sid, sel, wish);
  S.ui.sel = []; S.ui.selSid = null; S.ui.terms = false; delete S.drafts['wish-' + sid];
  if (s.type === 'grp'){ flashNext('Anmälan är skickad. Abbe granskar den, och du betalar när den är godkänd.'); go('mina-sidor'); }
  else go('betala-' + bid);
}
async function rebook(bid){ await B.rebook(bid); go('betala-' + bid); }
async function startPay(bid){ await B.startPay(bid); }
async function simulatePaid(fu, bid){ await B.simulatePaid(fu, bid); }
async function verifyRefunds(fu, bid){ await B.verifyRefunds(fu, bid); }
async function cancelDo(bid){
  const b = myB(bid); if (!b) throw userErr('Bokningen finns inte.');
  const sel = (S.ui.cxBid === bid ? S.ui.cx : (b.players || [])).filter(p => (b.players || []).indexOf(p) >= 0);
  if (!sel.length) throw userErr('Välj minst en spelare att avboka.');
  const refund = Number(await B.cancel(bid, sel)) || 0;
  S.ui.cx = null; S.ui.cxBid = null;
  flashNext(refund > 0 ? 'Avbokningen är klar. ' + kr(refund) + ' betalas tillbaka till Swish.' : 'Avbokningen är klar.');
  go('mina-sidor');
}
async function moveDo(bid){
  const to = S.ui.mvBid === bid ? S.ui.mv : null;
  const toS = to && S.sessions[to];
  if (!toS) throw userErr('Välj ett pass att flytta till.');
  await B.move(bid, to);
  S.ui.mv = null; S.ui.mvBid = null;
  flashNext('Bokningen är flyttad till ' + fWhen(startOf(toS)) + '.' + (toS.type === 'grp' ? ' Abbe granskar flytten.' : ''));
  go('mina-sidor');
}
function approve(fu, bid, msg){ return B.approve(fu, bid, msg); }
function decline(fu, bid, msg){ return B.decline(fu, bid, msg); }
function cancelSession(sid, reason, msg){ return B.cancelSession(sid, reason, msg); }

/* ---------- Demoläge: allt sparas i webbläsaren, koden visas på skärmen ---------- */
function makeDemo(){
  const KEY = 'abbe-khalili-demo-v1';
  let st = null, pending = null;
  function seed(){
    const out = {};
    const add = (id, type, days, h, m, place, focus, aud) => { const d = new Date(); d.setDate(d.getDate() + days); d.setHours(h, m, 0, 0); out[id] = {type, date: ymd(d), time: hm(d), max: TYPES[type].max, place, focus, audience: aud, equipment: DEFAULT_EQ, status:'open', checked:false, test:true}; };
    add('demo1','ind',1,17,0,'Testplan A','Utifrån spelarens behov','Alla åldrar');
    add('demo2','grp',2,17,0,'Testplan B','Passningsspel och första touch','9–11 år');
    add('demo3','duo',3,16,30,'Testplan A','Avslut','10–13 år');
    add('demo4','grp',5,10,0,'Testplan B','Spelförståelse','12–14 år');
    add('demo5','duo',6,11,0,'Testplan A','Teknik i hög fart','15 år och vuxna');
    add('demo6','ind',7,18,0,'Testplan A','Utifrån spelarens behov','Alla åldrar');
    return out;
  }
  function load(){ try { st = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (_){ st = null; } if (!st || !st.sessions) st = {sessions: seed(), families:{}, user:null, admin:false}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (_){ } }
  function computeCounts(){
    const now = Date.now(), c = {};
    for (const fu in st.families){ const bk = st.families[fu].bookings || {}; for (const id in bk){ const b = bk[id]; const k = b.sid; c[k] = c[k] || {used:0, confirmed:0, pending:0}; if (counts({st: b.status, hold: b.holdUntil, payBy: b.payBy}, now)) c[k].used += b.n; if (b.status === 'confirmed') c[k].confirmed += b.n; if (b.status === 'pending_review') c[k].pending += b.n; } }
    return c;
  }
  function publish(){ save(); S.sessions = st.sessions; S.families = st.families; S.uid = st.user ? st.user.id : null; S.email = st.user ? st.user.contact : null; S.isAdmin = !!(st.user && st.admin); S.counts = computeCounts(); S.loaded = {s:true, t:true, f:true}; S.fresh = true; S.ready = true; }
  function needUser(){ if (!st.user) throw userErr('Bekräfta med koden först.'); }
  function fam(){ needUser(); const f = st.families[st.user.id]; if (!f) throw userErr('Fyll i dina uppgifter först.'); return f; }
  function bk(fu, bid){ const f = st.families[fu]; const b = f && f.bookings && f.bookings[bid]; if (!b) throw userErr('Bokningen finns inte.'); return b; }
  function own(bid){ needUser(); return bk(st.user.id, bid); }
  function ownOrAdmin(fu, bid){ needUser(); if (fu !== st.user.id && !st.admin) throw userErr('Du har inte behörighet till bokningen.'); return bk(fu, bid); }
  function needAdmin(){ if (!(st.user && st.admin)) throw userErr('Bara Abbe kan göra det här.'); }
  function used(sid, exclude){ const now = Date.now(); let u = 0; for (const fu in st.families) for (const id in (st.families[fu].bookings || {})){ if (id === exclude) continue; const b = st.families[fu].bookings[id]; if (b.sid === sid && counts({st: b.status, hold: b.holdUntil, payBy: b.payBy}, now)) u += b.n; } return u; }
  function addRefund(b, amount, reason){ b.refunds = b.refunds || {}; b.refunds[rid('r')] = {amount, status:'pending', reason, at: Date.now()}; }
  function cancelS(sid, reason, msg){
    Object.assign(st.sessions[sid], {status:'cancelled', cancelReason: reason, cancelMsg: msg || '', cancelledAt: Date.now(), checked:'cancelled'});
    for (const fu in st.families) for (const id in (st.families[fu].bookings || {})){
      const b = st.families[fu].bookings[id];
      if (b.sid !== sid || ['cancelled','declined','session_cancelled'].indexOf(b.status) >= 0) continue;
      const m = money(b); b.status = 'session_cancelled'; b.endedAt = Date.now();
      if (m.remaining > 0) addRefund(b, m.remaining, 'Passet inställt');
    }
  }
  const api = {
    mode:'demo', canSms:true,
    async init(){ load(); publish(); api.runChecks(); setInterval(() => { api.runChecks(); publish(); render(); }, 30000); },
    async reload(){ publish(); },
    async sendCode(via, contact){ const code = String(Math.floor(100000 + Math.random() * 900000)); pending = {contact: String(contact).toLowerCase(), code}; return {demoCode: code}; },
    async verifyCode(via, contact, code){
      if (!pending || pending.contact !== String(contact).toLowerCase() || pending.code !== String(code).trim()) throw userErr('Koden stämmer inte. Kontrollera och försök igen.');
      let h = 0; for (const ch of pending.contact) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      st.user = {id: 'u' + h.toString(36), contact: pending.contact}; st.admin = false; pending = null; publish();
    },
    async signOut(){ st.user = null; st.admin = false; publish(); },
    toggleAdmin(){ if (!st.user) return; st.admin = !st.admin; publish(); },
    async saveAccount(a){ needUser(); const f = st.families[st.user.id]; if (f) f.account = Object.assign({}, f.account, a); else st.families[st.user.id] = {account: Object.assign({}, a, {consentAt: Date.now()}), players:{}, bookings:{}, createdAt: Date.now()}; publish(); },
    async savePlayer(pid, p){ const f = fam(); const id = pid || rid('p'); f.players[id] = Object.assign({}, f.players[id] || {createdAt: Date.now()}, p); publish(); return id; },
    async removePlayer(pid){ const f = fam(); if (f.players[pid]) f.players[pid].removed = true; publish(); },
    async book(sid, pids, wish){
      const s = st.sessions[sid], now = Date.now(), f = fam();
      if (!s || s.status !== 'open' || startOf(s) - BOOK_CLOSE <= now) throw userErr('Passet går inte att boka längre.');
      const n = pids.length;
      if (!n) throw userErr('Välj minst en spelare.');
      if (s.type === 'ind' && n > 1) throw userErr('Individuell träning gäller en spelare.');
      if (pids.some(p => !f.players[p] || f.players[p].removed)) throw userErr('Någon av spelarna finns inte.');
      const mine = Object.values(f.bookings).filter(b => b.sid === sid && counts({st: b.status, hold: b.holdUntil, payBy: b.payBy}, now));
      if (mine.some(b => (b.players || []).some(p => pids.indexOf(p) >= 0))) throw userErr('Någon av spelarna är redan bokad på passet.');
      if (mine.reduce((a, b) => a + b.n, 0) + n > 3) throw userErr('Du kan boka högst 3 platser per pass.');
      const u = used(sid);
      if (u + n > s.max) throw userErr(s.max - u > 0 ? 'Det finns bara ' + (s.max - u) + ' lediga platser kvar.' : 'Passet hann bli fullbokat.');
      const grp = s.type === 'grp', bid = rid('b'), price = TYPES[s.type].price;
      f.bookings[bid] = {sid, type: s.type, players: pids.slice(), n, price, total: n * price, status: grp ? 'pending_review' : 'reserved', wish, createdAt: now, holdUntil: grp ? 0 : now + HOLD_MS, payBy: 0, pay:{status:'unpaid', amount:0}, refunds:{}};
      publish(); return bid;
    },
    async rebook(bid){
      const b = own(bid), s = st.sessions[b.sid], now = Date.now();
      if (effStatus(b, now) !== 'expired') throw userErr('Bokningen kan inte reserveras igen.');
      if (!s || s.status !== 'open' || startOf(s) - BOOK_CLOSE <= now) throw userErr('Passet går inte att boka längre.');
      if (used(b.sid, bid) + b.n > s.max) throw userErr('Det finns inte längre plats för ' + b.n + ' spelare.');
      Object.assign(b, {status:'reserved', holdUntil: now + HOLD_MS, pay:{status:'unpaid', amount:0}}); publish();
    },
    async startPay(bid){
      const b = own(bid), now = Date.now(), es = effStatus(b, now);
      if (es !== 'reserved' && es !== 'approved') throw userErr('Bokningen kan inte betalas just nu.');
      b.pay = {status:'waiting', amount: b.total, at: now}; if (es === 'reserved') b.holdUntil = now + HOLD_MS; publish();
    },
    async simulatePaid(fu, bid){
      const b = ownOrAdmin(fu, bid), now = Date.now(), es = effStatus(b, now);
      if (es !== 'reserved' && es !== 'approved') throw userErr('Tiden för betalningen har gått ut.');
      Object.assign(b, {pay:{status:'verified', amount: b.total, at: now}, status:'confirmed', holdUntil:0, payBy:0}); publish();
    },
    async verifyRefunds(fu, bid){ const b = ownOrAdmin(fu, bid); Object.values(b.refunds || {}).forEach(r => { r.status = 'verified'; r.verifiedAt = Date.now(); }); publish(); },
    async cancel(bid, pids){
      const b = own(bid), s = st.sessions[b.sid], now = Date.now(), es = effStatus(b, now);
      if (ACTIVE.indexOf(es) < 0 || !s || now >= startOf(s)) throw userErr('Bokningen kan inte avbokas.');
      const keep = (b.players || []).filter(p => pids.indexOf(p) < 0), rm = b.n - keep.length;
      if (rm <= 0) throw userErr('Välj minst en spelare att avboka.');
      const inTime = now <= startOf(s) - CANCEL_LIMIT, m = money(b);
      const refund = (m.paid > 0 && inTime) ? Math.min(m.remaining, rm * b.price) : 0;
      Object.assign(b, {players: keep, n: keep.length, total: keep.length * b.price});
      if (!keep.length){ b.status = 'cancelled'; b.endedAt = now; }
      if (refund > 0) addRefund(b, refund, keep.length ? 'Avbokning av ' + rm + ' spelare' : 'Avbokad i tid');
      if (m.paid > 0 && !inTime) b.lateCancel = true;
      publish(); return refund;
    },
    async move(bid, to){
      const b = own(bid), from = st.sessions[b.sid], toS = st.sessions[to], now = Date.now(), es = effStatus(b, now);
      if (['pending_review','approved','confirmed'].indexOf(es) < 0 || !from || now > startOf(from) - CANCEL_LIMIT) throw userErr('Bokningen kan inte flyttas längre.');
      if (!toS || to === b.sid || toS.type !== b.type || toS.status !== 'open' || startOf(toS) - CANCEL_LIMIT <= now) throw userErr('Det passet går inte att flytta till.');
      if (used(to, bid) + b.n > toS.max) throw userErr('Passet har inte längre plats för ' + b.n + ' spelare.');
      Object.assign(b, {sid: to, status: toS.type === 'grp' ? 'pending_review' : (es === 'confirmed' ? 'confirmed' : b.status), movedFrom: from ? b.sid : null, payBy: 0, decisionMsg:''});
      publish();
    },
    async approve(fu, bid, msg){
      needAdmin(); const b = bk(fu, bid), s = st.sessions[b.sid], now = Date.now();
      if (effStatus(b, now) !== 'pending_review') throw userErr('Anmälan är redan hanterad.');
      const paid = money(b).paid > 0, st0 = startOf(s);
      Object.assign(b, {status: paid ? 'confirmed' : 'approved', payBy: paid ? 0 : (now < st0 - CHECK_LIMIT ? st0 - CHECK_LIMIT : st0 - H), decisionMsg: msg || ''});
      publish();
    },
    async decline(fu, bid, msg){
      needAdmin(); const b = bk(fu, bid), m = money(b);
      Object.assign(b, {status:'declined', endedAt: Date.now(), decisionMsg: msg || ''});
      if (m.remaining > 0) addRefund(b, m.remaining, 'Anmälan avslagen');
      publish();
    },
    async cancelSession(sid, reason, msg){ needAdmin(); if (!st.sessions[sid] || st.sessions[sid].status !== 'open') throw userErr('Passet är redan inställt.'); cancelS(sid, reason, msg); publish(); },
    async setAttendance(fu, bid, pid, val){ needAdmin(); const b = bk(fu, bid); b.attended = Object.assign({}, b.attended, {[pid]: val}); publish(); },
    async upsertSession(sid, d){
      needAdmin();
      const data = {type: d.type, date: d.date, time: d.time, max: d.max, place: d.place, focus: d.focus, audience: d.audience, equipment: d.equipment};
      if (sid){ const old = st.sessions[sid]; if (!old) throw userErr('Passet finns inte.'); if (old.date !== d.date || old.time !== d.time) data.checked = false; Object.assign(old, data); }
      else st.sessions[rid('s')] = Object.assign(data, {status:'open', checked:false});
      publish();
    },
    async deleteSession(sid){
      needAdmin();
      for (const fu in st.families) for (const id in (st.families[fu].bookings || {})) if (st.families[fu].bookings[id].sid === sid) throw userErr('Passet har bokningar. Ställ in det i stället.');
      delete st.sessions[sid]; publish();
    },
    runChecks(){
      if (!st) return; const now = Date.now(); let changed = false;
      for (const sid in st.sessions){
        const s = st.sessions[sid]; if (s.status !== 'open' || s.checked) continue;
        const st0 = startOf(s); if (now < st0 - CHECK_LIMIT || now >= st0) continue;
        let conf = 0; for (const fu in st.families) for (const id in (st.families[fu].bookings || {})){ const b = st.families[fu].bookings[id]; if (b.sid === sid && b.status === 'confirmed') conf += b.n; }
        const min = TYPES[s.type].min;
        if (s.type === 'ind' || conf >= min) s.checked = 'ok'; else cancelS(sid, 'För få bekräftade spelare (' + conf + ' av minst ' + min + ')', '');
        changed = true;
      }
      if (changed) publish();
    }
  };
  return api;
}

/* ---------- Riktig databas: Supabase ---------- */
function makeSupa(){
  let sb = null, loading = null;
  const ms = v => v ? new Date(v).getTime() : 0;
  function toErr(e){
    const m = (e && e.message) || '';
    if (e && e.code === 'P0001') return userErr(m);
    if (/expired|invalid/i.test(m) && /token|otp|code/i.test(m)) return userErr('Koden stämmer inte eller har gått ut. Skicka en ny kod.');
    if (/rate limit|too many/i.test(m)) return userErr('För många koder på kort tid. Vänta en stund och försök igen.');
    if (/signups not allowed|not authorized/i.test(m)) return userErr('Det gick inte att skicka koden till den adressen.');
    return e;
  }
  async function q(p){ const res = await p; if (res.error) throw toErr(res.error); return res.data; }
  async function call(fn, args){ const data = await q(sb.rpc(fn, args || {})); await api.reload(); return data; }
  function mapSessions(rows){
    const o = {};
    rows.forEach(r => { const d = new Date(r.starts_at); o[r.id] = {type: r.type, date: ymd(d), time: hm(d), max: r.max, place: r.place, focus: r.focus, audience: r.audience, equipment: r.equipment, status: r.status, checked: r.checked || false, cancelReason: r.cancel_reason || '', cancelMsg: r.cancel_msg || '', test: !!r.test}; });
    return o;
  }
  function mapFamilies(f, p, b, r){
    const o = {}, byB = {};
    f.forEach(x => { o[x.user_id] = {account:{name: x.name, phone: x.phone, email: x.email, role: x.role}, players:{}, bookings:{}}; });
    p.forEach(x => { const t = o[x.user_id]; if (t) t.players[x.id] = {name: x.name, birthYear: x.birth_year, self: x.self, club: x.club, exp: x.exp, level: x.level, goals: x.goals || [], notes: x.notes, removed: x.removed, createdAt: ms(x.created_at)}; });
    b.forEach(x => { const t = o[x.user_id]; if (!t) return; const bb = {sid: x.session_id, type: x.type, players: x.players || [], n: x.n, price: x.price, total: x.total, status: x.status, wish: x.wish && x.wish.mode ? x.wish : null, holdUntil: ms(x.hold_until), payBy: ms(x.pay_by), pay:{status: x.pay_status, amount: x.pay_amount, at: ms(x.paid_at)}, refunds:{}, decisionMsg: x.decision_msg || '', lateCancel: x.late_cancel, attended: x.attended || {}, createdAt: ms(x.created_at), endedAt: ms(x.ended_at), movedFrom: x.moved_from}; t.bookings[x.id] = bb; byB[x.id] = bb; });
    r.forEach(x => { const bb = byB[x.booking_id]; if (bb) bb.refunds[x.id] = {amount: x.amount, status: x.status === 'verified' ? 'verified' : 'pending', reason: x.reason, at: ms(x.created_at)}; });
    return o;
  }
  const api = {
    mode:'live', canSms: !!CONFIG.sms,
    async init(){
      await loadScript(SUPA_JS);
      sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
      sb.auth.onAuthStateChange(() => { api.reload().catch(() => {}); });
      await api.reload();
      setInterval(() => { api.reload().catch(() => {}); }, 30000);
    },
    reload(){
      if (loading) return loading;
      loading = (async () => {
        try {
          const sess = (await sb.auth.getSession()).data.session, u = sess && sess.user;
          S.uid = u ? u.id : null; S.email = u ? (u.email || u.phone || '') : null;
          const since = new Date(Date.now() - 120 * 24 * H).toISOString();
          const [rows, cnt] = await Promise.all([q(sb.from('sessions').select('*').gte('starts_at', since).order('starts_at')), q(sb.rpc('session_counts'))]);
          S.sessions = mapSessions(rows || []);
          const c = {}; (cnt || []).forEach(x => { c[x.session_id] = {used: x.used, confirmed: x.confirmed, pending: x.pending}; }); S.counts = c;
          if (S.uid){
            const [adm, f, p, b, r] = await Promise.all([q(sb.rpc('is_admin')), q(sb.from('families').select('*')), q(sb.from('players').select('*')), q(sb.from('bookings').select('*')), q(sb.from('refunds').select('*'))]);
            S.isAdmin = !!adm; S.families = mapFamilies(f || [], p || [], b || [], r || []);
          } else { S.isAdmin = false; S.families = {}; }
          S.loaded = {s:true, t:true, f:true}; S.fresh = true; S.slow = false; S.err = null;
        } catch (e){ console.warn(e); S.err = 'load'; S.loaded = {s:true, t:true, f:true}; }
        finally { S.ready = true; loading = null; render(); }
      })();
      return loading;
    },
    async sendCode(via, contact){
      if (via === 'sms') await q(sb.auth.signInWithOtp({phone: normPhone(contact)}));
      else await q(sb.auth.signInWithOtp({email: String(contact).trim(), options:{shouldCreateUser:true}}));
      return {};
    },
    async verifyCode(via, contact, code){
      if (!code) throw userErr('Skriv in koden.');
      if (via === 'sms') await q(sb.auth.verifyOtp({phone: normPhone(contact), token: code, type:'sms'}));
      else await q(sb.auth.verifyOtp({email: String(contact).trim(), token: code, type:'email'}));
      await api.reload();
    },
    async signOut(){ await sb.auth.signOut(); await api.reload(); },
    async saveAccount(a){
      const row = {user_id: S.uid, name: a.name, phone: a.phone || '', email: a.email || (S.email && S.email.indexOf('@') > 0 ? S.email : ''), role: a.role || 'vh'};
      if (!me()) row.consent_at = new Date().toISOString();
      await q(sb.from('families').upsert(row)); await api.reload();
    },
    async savePlayer(pid, p){
      const row = {name: p.name, birth_year: p.birthYear, self: !!p.self, club: p.club || '', exp: p.exp, level: p.level, goals: p.goals || [], notes: p.notes || '', updated_at: new Date().toISOString()};
      let id = pid;
      if (pid) await q(sb.from('players').update(row).eq('id', pid));
      else { const d = await q(sb.from('players').insert(Object.assign(row, {user_id: S.uid})).select('id').single()); id = d.id; }
      await api.reload(); return id;
    },
    async removePlayer(pid){ await q(sb.from('players').update({removed:true}).eq('id', pid)); await api.reload(); },
    book: (sid, pids, wish) => call('book', {p_session: sid, p_players: pids, p_wish: wish}),
    rebook: bid => call('rebook', {p_booking: bid}),
    startPay: bid => call('start_pay', {p_booking: bid}),
    simulatePaid: (fu, bid) => call('simulate_paid', {p_booking: bid}),
    verifyRefunds: (fu, bid) => call('verify_refunds', {p_booking: bid}),
    cancel: (bid, pids) => call('cancel_booking', {p_booking: bid, p_players: pids}),
    move: (bid, to) => call('move_booking', {p_booking: bid, p_to: to}),
    approve: (fu, bid, msg) => call('admin_approve', {p_booking: bid, p_msg: msg || ''}),
    decline: (fu, bid, msg) => call('admin_decline', {p_booking: bid, p_msg: msg || ''}),
    cancelSession: (sid, reason, msg) => call('admin_cancel_session', {p_session: sid, p_reason: reason, p_msg: msg || ''}),
    setAttendance: (fu, bid, pid, val) => call('admin_set_attendance', {p_booking: bid, p_player: pid, p_val: val}),
    upsertSession: (sid, d) => call('admin_upsert_session', {p_id: sid || null, p_data: {type: d.type, starts_at: new Date(d.date + 'T' + d.time + ':00').toISOString(), max: d.max, place: d.place, focus: d.focus, audience: d.audience, equipment: d.equipment}}),
    deleteSession: sid => call('admin_delete_session', {p_id: sid}),
    runChecks(){}
  };
  return api;
}

/* ---------- Gemensamma bitar ---------- */
function notice(title, text, extra){

function loadingView(){ return '<div class="wrap loading">Hämtar bokningar …</div>'; }
function dataNote(){
  if (S.err) return '<div class="box t-bad">Bokningsdatan kunde inte läsas. Ladda om sidan.</div>';
  if (S.slow && !S.fresh) return '<div class="box t-warn">Datan går inte att nå just nu. Det som visas kan vara gammalt.</div>';
  return '';
}
function gate(needAccount){
  if (!S.ready || !isLoaded()) return loadingView();
  if (S.err && !Object.keys(S.sessions).length) return notice('Sidan kunde inte laddas', 'Kontrollera din uppkoppling och ladda om sidan.');

}
function readGuest(){
  const v = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const d = S.drafts.guest || {};
  const name = String(v('g-name') || d.name || '').trim(), phone = String(v('g-phone') || d.phone || '').trim(), email = String(v('g-email') || d.email || '').trim();
  if (!name) throw userErr('Skriv ditt namn.');
  if (!phone && !email) throw userErr('Fyll i telefon eller e-post så att Abbe kan nå dig.');
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw userErr('Kontrollera e-postadressen.');
  return {name, phone, email};
}
function readPlayer(fd){
  const name = String(fd.get('name') || '').trim(), by = String(fd.get('by') || '').trim(), year = new Date().getFullYear();
  if (!name) throw userErr('Skriv spelarens förnamn.');
  if (!/^\d{4}$/.test(by) || Number(by) < 1940 || Number(by) > year) throw userErr('Skriv spelarens födelseår med fyra siffror, till exempel 2014.');
  if (!fd.get('who')) throw userErr('Välj vem profilen gäller.');
  if (!fd.get('exp')) throw userErr('Välj spelarens erfarenhet.');
  if (!fd.get('level')) throw userErr('Välj spelarens nuvarande nivå.');
  return {name, birthYear: Number(by), self: fd.get('who') === 'jag', club: String(fd.get('club') || '').trim(), exp: String(fd.get('exp')), level: String(fd.get('level')), goals: fd.getAll('goals').map(String), notes: String(fd.get('notes') || '').trim(), updatedAt: Date.now()};
}

async function saveInlinePlayer(){
  const f = document.getElementById('newp-form'); if (!f) return null;
  const p = readPlayer(new FormData(f));
  if (!me() || !me().account) await B.saveAccount(Object.assign(readGuest(), {role: p.self ? 'spelare' : 'vh'}));
  const pid = await B.savePlayer(null, p);
  delete S.drafts.guest; delete S.drafts.newp;
  return pid;
}

/* ---------- Mina sidor ---------- */
function bookingCard(bid, b, now){
  const s = S.sessions[b.sid], fam = me(), st0 = s ? startOf(s) : 0, es = effStatus(b, now);
  const bs = BST[es] || [es, 'neutral'], ps = payStatus(b), m = money(b);
  const names = (b.players || []).map(p => (fam.players[p] || {}).name || 'Spelare').join(', ') || '–';
  const future = s && now < st0, inTime = s && now <= st0 - CANCEL_LIMIT;
  const notes = [], acts = [];
  if (es === 'reserved'){ notes.push('Platserna hålls till kl. ' + fTime(b.holdUntil) + '. Betala innan dess.'); acts.push('<a class="btn btn-primary btn-sm" href="#betala-' + esc(bid) + '">Betala ' + kr(b.total) + '</a>'); }
  if (es === 'expired' && future){ notes.push('Du hann inte betala inom 10 minuter, så platserna släpptes.'); acts.push('<button class="btn btn-ghost btn-sm" data-act="rebook" data-bid="' + esc(bid) + '">Reservera igen</button>'); }
  if (es === 'pending_review') notes.push(m.paid > 0 ? 'Abbe granskar flytten till det här passet.' : 'Abbe sätter ihop gruppen. Du betalar när anmälan är godkänd.');
  if (es === 'approved'){ notes.push('Betala senast ' + fWhen(b.payBy) + ', annars går platsen till någon annan.'); acts.push('<a class="btn btn-primary btn-sm" href="#betala-' + esc(bid) + '">Betala ' + kr(b.total) + '</a>'); }
  if (es === 'confirmed' && future) notes.push(inTime ? 'Avboka eller flytta senast ' + fWhen(st0 - CANCEL_LIMIT) + ' för full återbetalning.' : 'Mindre än 12 timmar kvar. Avbokning ger ingen återbetalning.');
  if (es === 'session_cancelled'){ notes.push('Passet är inställt' + (s && s.cancelReason ? ': ' + s.cancelReason : '') + '.'); if (s && s.cancelMsg) notes.push('Meddelande från Abbe: ' + s.cancelMsg); if (m.remaining > 0 && m.refPending === 0) notes.push('Hela beloppet betalas tillbaka.'); acts.push('<a class="btn btn-ghost btn-sm" href="#kalender">Hitta ett annat pass</a>'); }
  if (b.decisionMsg && ['approved','confirmed','declined'].indexOf(es) >= 0) notes.push('Meddelande från Abbe: ' + b.decisionMsg);
  if (b.lateCancel && es !== 'cancelled') notes.push('En spelare avbokades för sent och återbetalades inte.');
  if (future && ACTIVE.indexOf(es) >= 0) acts.push('<a class="linkbtn" href="#avboka-' + esc(bid) + '">' + (es === 'pending_review' ? 'Dra tillbaka anmälan' : 'Avboka') + '</a>');
  if (future && inTime && ['pending_review','approved','confirmed'].indexOf(es) >= 0 && moveTargets(b, now).length) acts.push('<a class="linkbtn" href="#flytta-' + esc(bid) + '">Flytta till annat pass</a>');
  if (m.refPending > 0) acts.push('<button class="btn btn-test btn-sm" data-act="ref-verify" data-fu="' + esc(S.uid) + '" data-bid="' + esc(bid) + '">Test: Swish bekräftar återbetalningen</button>');
  return '<article class="card bcard"><div class="row between" style="align-items:baseline"><h3>' + (s ? TYPES[b.type].short + ' · ' + esc(s.focus || '') : 'Borttaget pass') + '</h3><span class="small muted tnum">' + kr(b.total || 0) + '</span></div>' +
    '<div class="muted small">' + (s ? fWhen(st0) + ' · ' + esc(s.place || '') : '') + '</div>' +
    '<div class="small"><span class="muted">Spelare:</span> <strong>' + esc(names) + '</strong></div>' +
    (b.wish ? '<div class="small"><span class="muted">Fokus:</span> ' + esc(b.wish.mode === 'self' ? ((b.wish.goals || []).join(', ') || 'Eget val') : 'Abbe väljer') + (b.wish.note ? ' – ' + esc(b.wish.note) : '') + '</div>' : '') +
    '<div class="stack-s"><div class="kv small"><span class="muted">Bokning</span>' + chip(bs[0], bs[1]) + '</div><div class="kv small"><span class="muted">Betalning</span>' + chip(ps[0], ps[1]) + '</div></div>' +
    notes.map(t => '<p class="small muted">' + esc(t) + '</p>').join('') +
    (acts.length ? '<div class="acts">' + acts.join('') + '</div>' : '') + '</article>';
}

function statusOf(sid, s, now){
  const state = sessionState(sid, s, now), mn = minNote(s, state.stats, now);
  if (state.code === 'cancelled') return chip('Inställt', 'bad');
  if (state.code === 'past') return chip('Har varit', 'neutral');

  const presentN = rowsP.filter(r0 => r0.x.b.attended && r0.x.b.attended[r0.pid]).length;
  const partTable = rowsP.length ? '<div class="tablebox"><table><thead><tr><th>Spelare</th><th>Ålder</th><th>Nivå</th><th>Bokad av</th><th>Bokning</th><th>Betalning</th><th>Närvaro</th></tr></thead><tbody>' +
    rowsP.map(r0 => { const bs = BST[r0.x.es] || [r0.x.es, 'neutral'], ps = payStatus(r0.x.b), on = !!(r0.x.b.attended && r0.x.b.attended[r0.pid]); return '<tr><td style="font-weight:600">' + esc(r0.p.name || 'Spelare') + (r0.p.goals && r0.p.goals.length ? '<div class="small muted" style="font-weight:400">Vill utveckla: ' + esc(r0.p.goals.join(', ')) + '</div>' : '') + (r0.x.b.wish ? '<div class="small" style="font-weight:400">' + esc(wishText(r0.x.b.wish)) + '</div>' : '') + '</td><td>' + esc(ageOf(r0.p.birthYear) || '–') + '</td><td>' + esc(LEVEL[r0.p.level] || '–') + '</td><td>' + esc((r0.x.fam.account || {}).name || '–') + '<div class="small muted">' + esc([(r0.x.fam.account || {}).phone, (r0.x.fam.account || {}).email].filter(Boolean).join(' · ')) + '</div></td><td>' + chip(bs[0], bs[1]) + '</td><td>' + chip(ps[0], ps[1]) + '</td><td><button class="att" data-act="att" data-fu="' + esc(r0.x.fu) + '" data-bid="' + esc(r0.x.bid) + '" data-pid="' + esc(r0.pid) + '" aria-pressed="' + on + '" aria-label="Närvaro för ' + esc(r0.p.name || 'spelare') + '">' + (on ? '✓ Närvarande' : 'Markera närvaro') + '</button></td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">Inga deltagare än.</div>';
  return '<a href="#admin-pass" class="linkbtn">← Alla pass</a>' +
    '<div class="stack-s"><div class="row">' + typeTag(s.type) + statusOf(sid, s, now) + (s.test ? chip('Testpass','neutral') : '') + '</div><h1 class="display h2">' + esc(T.short + ' ' + fWhen(st)) + '</h1><p class="muted">' + esc(s.focus || '') + (s.audience ? ' · ' + esc(s.audience) : '') + ' · ' + esc(s.place || '') + ' · ' + kr(T.price) + ' per spelare</p></div>' +
    (s.status === 'cancelled' ? '<div class="box t-bad"><strong>Passet är inställt.</strong> ' + esc(s.cancelReason || '') + (s.cancelMsg ? '<br>Meddelande: ' + esc(s.cancelMsg) : '') + '</div>' : '') +
    '<div class="tiles"><div class="card tile"><div class="k">Bokade platser</div><div class="v">' + stats.used + ' av ' + stats.max + '</div></div><div class="card tile"><div class="k">Bekräftade (betalda)</div><div class="v">' + stats.confirmed + (s.type !== 'ind' ? ' · minst ' + T.min : '') + '</div></div>' + (s.type === 'grp' ? '<div class="card tile"><div class="k">Väntar på granskning</div><div class="v">' + stats.pending + '</div></div>' : '') + '<div class="card tile"><div class="k">Kontroll 24 h före</div><div class="v" style="font-size:22px">' + (s.checked === 'ok' ? 'Klar – blir av' : s.status === 'cancelled' ? '–' : fWhen(st - CHECK_LIMIT)) + '</div></div></div>' +
    actions + cancelPanel + review +
    '<section class="stack-s"><div class="row between"><h2 style="margin:0;font-size:20px">Deltagare och närvaro</h2><span class="muted small">Närvarande: ' + presentN + ' av ' + rowsP.length + '</span></div>' + partTable + '</section>' +
    (other.length ? '<section class="stack-s"><h2 style="margin:0;font-size:18px">Avbokade, avslagna och utgångna</h2><div class="tablebox"><table><tbody>' + other.map(x => { const bs = BST[x.es] || [x.es, 'neutral'], ps = payStatus(x.b); return '<tr><td>' + esc((x.b.players || []).map(p => pl(x, p).name || 'Spelare').join(', ') || '–') + '</td><td>' + esc((x.fam.account || {}).name || '–') + '</td><td>' + chip(bs[0], bs[1]) + '</td><td>' + chip(ps[0], ps[1]) + '</td></tr>'; }).join('') + '</tbody></table></div></section>' : '');
}
function adminPayments(){
  const now = Date.now(), rows = [];
  let inSum = 0, outSum = 0, waitSum = 0;
  allBookings().forEach(x => {
    const s = S.sessions[x.b.sid], who = ((x.fam.account || {}).name || 'Bokare') + ' · ' + (s ? TYPES[x.b.type].short + ' ' + fDay(startOf(s)) : 'borttaget pass');
    const p = x.b.pay || {};
    if (p.status === 'verified'){ inSum += Number(p.amount) || 0; rows.push({at: p.at || 0, who, kind:'Betalning', amt: p.amount, st:['Verifierad','ok']}); }
    if (p.status === 'waiting'){ waitSum += Number(p.amount) || 0; rows.push({at: p.at || 0, who, kind:'Betalning', amt: p.amount, st:['Väntar på Swish','info'], btn:'<button class="btn btn-test btn-sm" data-act="pay-verify" data-fu="' + esc(x.fu) + '" data-bid="' + esc(x.bid) + '">Test: verifiera</button>'}); }
    Object.values(x.b.refunds || {}).forEach(r => { if (!r) return; if (r.status === 'verified') outSum += Number(r.amount) || 0; rows.push({at: r.at || 0, who, kind:'Återbetalning – ' + (r.reason || ''), amt: r.amount, st: r.status === 'verified' ? ['Återbetald','ok'] : ['Väntar på verifiering','info'], btn: r.status === 'verified' ? '' : '<button class="btn btn-test btn-sm" data-act="ref-verify" data-fu="' + esc(x.fu) + '" data-bid="' + esc(x.bid) + '">Test: verifiera</button>'}); });
    if (x.b.lateCancel) rows.push({at: x.b.endedAt || x.b.createdAt || 0, who, kind:'Sen avbokning', amt: 0, st:['Ingen återbetalning','neutral']});
  });
  rows.sort((a, b) => b.at - a.at);
  return '<h1 class="display h2">Betalningar</h1><p class="box t-warn">Testläge: betalningar och återbetalningar är simulerade. En betalning eller återbetalning räknas som klar först när den är verifierad.</p>' +
    '<div class="tiles"><div class="card tile"><div class="k">Inbetalt (verifierat)</div><div class="v">' + kr(inSum) + '</div></div><div class="card tile"><div class="k">Återbetalt</div><div class="v">' + kr(outSum) + '</div></div><div class="card tile"><div class="k">Väntar på Swish</div><div class="v">' + kr(waitSum) + '</div></div></div>' +
    (rows.length ? '<div class="tablebox"><table><thead><tr><th>Datum</th><th>Bokare och pass</th><th>Typ</th><th class="num">Belopp</th><th>Status</th><th><span class="sr">Åtgärd</span></th></tr></thead><tbody>' + rows.map(r => '<tr><td style="white-space:nowrap">' + (r.at ? fDay(r.at) + ' ' + fTime(r.at) : '–') + '</td><td>' + esc(r.who) + '</td><td>' + esc(r.kind) + '</td><td class="num" style="font-weight:600;white-space:nowrap">' + kr(r.amt) + '</td><td>' + chip(r.st[0], r.st[1]) + '</td><td>' + (r.btn || '') + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">Inga betalningar än.</div>');
}

/* ---------- Formulär ---------- */
const FORMS = {
  async konto(f){
    const fd = new FormData(f);
    const name = String(fd.get('name') || '').trim(), phone = String(fd.get('phone') || '').trim(), email = String(fd.get('email') || '').trim(), role = String(fd.get('role') || '');
    const isNew = !me() || !me().account;
    if (!name) throw userErr('Skriv ditt namn.');
    if (!phone && !email) throw userErr('Fyll i telefon eller e-post så att Abbe kan nå dig.');
    if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw userErr('Kontrollera e-postadressen.');
    if (role !== 'spelare' && role !== 'vh') throw userErr('Välj vem du bokar för.');
    if (isNew && !fd.get('consent')) throw userErr('Godkänn integritetstexten för att spara uppgifterna.');
    await B.saveAccount({name, phone, email, role});
    delete S.drafts.konto;
    const ret = S.ui.returnTo; S.ui.returnTo = null;
    if (isNew){ S.ui.returnAfterPlayer = ret; flashNext('Uppgifterna är sparade. Lägg nu till en spelarprofil.'); go('spelare-ny'); }
    else { flashNext('Uppgifterna är sparade.'); go(ret || 'mina-sidor'); }
  },
  async spelare(f){
    const fd = new FormData(f), pid = f.dataset.pid;
    const p = readPlayer(fd);
    if (!me() || !me().account){
      const guest = readGuest(), gc = document.getElementById('g-consent');
      if (!gc || !gc.checked) throw userErr('Godkänn att uppgifterna sparas enligt integritetstexten.');
      await B.saveAccount(Object.assign(guest, {role: p.self ? 'spelare' : 'vh'}));
      delete S.drafts.guest;
    }
    await B.savePlayer(pid || null, p);
    delete S.drafts[f.dataset.key];
    const ret = S.ui.returnAfterPlayer || S.ui.returnTo; S.ui.returnAfterPlayer = null; S.ui.returnTo = null;
    flashNext('Spelarprofilen är sparad.');
    go(ret || 'mina-sidor');
  },
  async pass(f){
    const fd = new FormData(f), sid = f.dataset.sid || '', old = sid ? S.sessions[sid] : null;
    const type = String(fd.get('type') || (old && old.type) || '');
    if (!TYPES[type]) throw userErr('Välj träningsform.');
    const date = String(fd.get('date') || ''), time = String(fd.get('time') || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) throw userErr('Välj datum.');
    if (!/^\d{2}:\d{2}$/.test(time)) throw userErr('Välj starttid.');
    const lo = type === 'grp' ? 6 : type === 'duo' ? 2 : 1, hi = TYPES[type].max;
    const max = Math.round(Number(fd.get('max')));
    if (!(max >= lo && max <= hi)) throw userErr('Max antal spelare ska vara mellan ' + lo + ' och ' + hi + ' för ' + TYPES[type].name.toLowerCase() + '.');
    const place = String(fd.get('place') || '').trim(), focus = String(fd.get('focus') || '').trim();
    if (!place) throw userErr('Skriv var passet är.');
    if (!focus) throw userErr('Skriv passets träningsfokus.');
    if (sid){ const used = sessionStats(sid).used; if (max < used) throw userErr('Det finns redan ' + used + ' bokade platser. Max kan inte vara lägre.'); }
    await B.upsertSession(sid || null, {type, date, time, max, place, focus, audience: String(fd.get('audience') || '').trim(), equipment: String(fd.get('equipment') || '').trim() || DEFAULT_EQ});
    delete S.drafts[f.dataset.key];
    flashNext(sid ? 'Passet är uppdaterat.' : 'Passet är skapat.');
    go(sid ? 'admin-pass-' + sid : 'admin-pass');
  }
};

/* ---------- Klick ---------- */
async function run(fn){
  if (S.busy) return;
  S.busy = true; render();
  try { await fn(); }
  catch (e){ console.warn(e); flash(errText(e), 'bad'); }
  finally { S.busy = false; render(); }
}
const A = {
  scroll(d){ const el = document.getElementById(d.to); if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); },
  filter(d){ S.filter = d.f; render(); },
  'flash-x'(){ S.flash = null; render(); },
  mtab(d){ S.ui.mtab = d.t; render(); },
  aptab(d){ S.ui.aptab = d.t; render(); },
  'goto-konto'(d){ S.ui.returnTo = d.ret || null; go('konto'); },
  'goto-player'(d){ S.ui.returnTo = d.ret || null; go('spelare-ny'); },
  sel(d){
    const sid = d.sid, s = S.sessions[sid]; if (!s) return;
    const elig = eligibleFor(sid); let cur = effectiveSel(sid, elig);
    if (cur.indexOf(d.pid) >= 0) cur = cur.filter(x => x !== d.pid);
    else cur = s.type === 'ind' ? [d.pid] : cur.concat(d.pid);
    S.ui.selSid = sid; S.ui.sel = cur; render();
  },
  book(d){ run(() => doBook(d.sid)); },
  'pay-start'(d){ run(() => startPay(d.bid)); },
  'pay-sim'(d){ run(async () => { await simulatePaid(S.uid, d.bid); flash('Betalningen är verifierad och bokningen är bekräftad.'); }); },
  'pay-verify'(d){ run(async () => { await simulatePaid(d.fu, d.bid); flash('Betalningen är markerad som verifierad.'); }); },
  'ref-verify'(d){ run(async () => { await verifyRefunds(d.fu, d.bid); flash('Återbetalningen är verifierad.'); }); },
  rebook(d){ run(() => rebook(d.bid)); },
  cx(d){
    const b = myB(d.bid); if (!b) return;
    let cur = S.ui.cxBid === d.bid ? S.ui.cx.slice() : (b.players || []).slice();
    cur = cur.indexOf(d.pid) >= 0 ? cur.filter(x => x !== d.pid) : cur.concat(d.pid);
    S.ui.cxBid = d.bid; S.ui.cx = cur; render();
  },
  'cancel-do'(d){ run(() => cancelDo(d.bid)); },
  mv(d){ S.ui.mvBid = d.bid; S.ui.mv = d.sid; render(); },
  'move-do'(d){
    const b = myB(d.bid);
    if (b && S.ui.mvBid !== d.bid){ const t = moveTargets(b, Date.now()); if (t[0]){ S.ui.mvBid = d.bid; S.ui.mv = t[0].id; } }
    run(() => moveDo(d.bid));
  },
  'inline-more'(d){ run(async () => { if (!S.ui.terms) throw userErr('Godkänn bokningsvillkoren först.'); await saveInlinePlayer(); S.ui.returnAfterPlayer = 'boka-' + d.sid; flashNext('Spelaren är sparad. Lägg till nästa spelare.'); go('spelare-ny'); }); },
  'p-rm-ask'(d){ S.ui.rmPid = d.pid; render(); },
  'p-rm-no'(){ S.ui.rmPid = null; render(); },
  'p-rm-do'(d){ run(async () => { await B.removePlayer(d.pid); S.ui.rmPid = null; flashNext('Spelaren är borttagen.'); go('mina-sidor'); }); },
  approve(d){ const el = document.getElementById('msg-' + d.bid); const msg = el ? el.value.trim() : ''; run(async () => { await approve(d.fu, d.bid, msg); flash('Anmälan är godkänd. Bokaren kan nu betala.'); }); },
  decline(d){ const el = document.getElementById('msg-' + d.bid); const msg = el ? el.value.trim() : ''; run(async () => { await decline(d.fu, d.bid, msg); flash('Anmälan är avslagen.'); }); },
  att(d){ const b = S.families[d.fu] && S.families[d.fu].bookings[d.bid]; if (!b) return; const cur = !!(b.attended && b.attended[d.pid]); run(() => B.setAttendance(d.fu, d.bid, d.pid, !cur)); },
  'cancel-open'(d){ S.ui.cancelSid = d.sid; render(); },
  'cancel-close'(){ S.ui.cancelSid = null; render(); },
  'cancel-session'(d){
    const f = document.getElementById('cancel-form'); const fd = f ? new FormData(f) : null;
    const reason = fd ? String(fd.get('reason') || REASONS[0]) : REASONS[0], msg = fd ? String(fd.get('msg') || '').trim() : '';
    run(async () => { await cancelSession(d.sid, reason, msg); S.ui.cancelSid = null; delete S.drafts['cancel-' + d.sid]; flash('Passet är inställt. Återbetalningarna väntar på verifiering.'); });
  },
  'del-ask'(d){ S.ui.delSid = d.sid; render(); },
  'del-no'(){ S.ui.delSid = null; render(); },
  'del-do'(d){ run(async () => { if (allBookings().some(x => x.b && x.b.sid === d.sid)) throw userErr('Passet har bokningar. Ställ in det i stället.'); await B.deleteSession(d.sid); S.ui.delSid = null; flashNext('Passet är borttaget.'); go('admin-pass'); }); }
};

/* ---------- Kod via mejl eller sms, inloggning och demoverktyg ---------- */
Object.assign(A, {
  'book-send'(d){
    run(async () => {
      preBook(d.sid);
      const g = readGuest(), via = d.via === 'sms' ? 'sms' : 'email';
      const contact = via === 'sms' ? g.phone : g.email;
      if (!contact) throw userErr(via === 'sms' ? 'Fyll i ditt mobilnummer för att få koden med sms.' : 'Fyll i din e-post för att få koden.');
      const r = await B.sendCode(via, contact);
      S.ui.codeTo = contact; S.ui.codeVia = via; S.ui.codeCtx = 'boka-' + d.sid; S.ui.demoCode = (r && r.demoCode) || null; S.ui.codeVal = '';
      flash(via === 'sms' ? 'Koden är skickad med sms.' : 'Koden är skickad till din e-post.');
    });
  },
  'book-verify'(d){
    run(async () => {
      const sid = d.arg;
      await B.verifyCode(S.ui.codeVia, S.ui.codeTo, String(S.ui.codeVal || '').trim());
      clearCode();
      const fam = me();
      if (fam && fam.account && activePlayers(fam).length){ flash('Välkommen tillbaka! Välj spelare och tryck på knappen för att boka.'); return; }
      await doBook(sid);
    });
  },
  'login-send'(d){
    run(async () => {
      const el = document.getElementById('l-contact'), contact = String((el && el.value) || S.ui.loginVal || '').trim();
      if (!contact) throw userErr(B.canSms ? 'Skriv din e-post eller ditt mobilnummer.' : 'Skriv din e-post.');
      const via = contact.indexOf('@') > 0 ? 'email' : 'sms';
      if (via === 'sms' && !B.canSms) throw userErr('Skriv din e-post. Kod med sms kommer snart.');
      if (via === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(contact)) throw userErr('Kontrollera e-postadressen.');
      const r = await B.sendCode(via, contact);
      S.ui.codeTo = contact; S.ui.codeVia = via; S.ui.codeCtx = 'login-' + d.ret; S.ui.demoCode = (r && r.demoCode) || null; S.ui.codeVal = '';
    });
  },
  'login-verify'(d){
    run(async () => {
      await B.verifyCode(S.ui.codeVia, S.ui.codeTo, String(S.ui.codeVal || '').trim());
      clearCode(); S.ui.loginVal = '';
      flashNext('Du är inloggad.');
      go(d.arg || 'mina-sidor');
    });
  },
  'code-reset'(){ clearCode(); render(); },
  logout(){ run(async () => { await B.signOut(); clearCode(); flashNext('Du är utloggad.'); go('start'); }); },
  'demo-admin'(){ if (B.toggleAdmin){ B.toggleAdmin(); go(S.isAdmin ? 'admin' : 'start'); } }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'code-in') S.ui.codeVal = t.value;
  if (t.id === 'l-contact') S.ui.loginVal = t.value;
});

/* ---------- Utkast för formulär ---------- */
function capture(f){
  const key = f.dataset.key; if (!key) return;
  const fd = new FormData(f), d = {};
  Array.from(new Set(Array.from(fd.keys()))).forEach(k => { const all = fd.getAll(k); d[k] = (k === 'goals' || k === 'wg') ? all : all[0]; });
  if (f.querySelector('[name="goals"]') && !d.goals) d.goals = [];
  if (f.querySelector('[name="wg"]') && !d.wg) d.wg = [];
  if (f.querySelector('[name="consent"]') && !d.consent) d.consent = '';
  S.drafts[key] = Object.assign({}, S.drafts[key] || {}, d);
}

/* ---------- Navigering ---------- */
function parseRoute(){
  const h = (location.hash || '').replace(/^#/, '');
  if (!h) return {name:'start'};
  const m = h.match(/^(admin-pass|admin-andra|pass|boka|betala|avboka|flytta|spelare)-([a-z0-9-]+)$/i);
  if (m) return {name: m[1], arg: m[2]};
  return {name: h};
}
function go(h){
  if (location.hash === '#' + h){ S.route = parseRoute(); if (!S.keepFlash) S.flash = null; S.keepFlash = false; render(); window.scrollTo(0, 0); }
  else location.hash = h;
}
function render(){
  const app = document.getElementById('app'); if (!app) return;
  const a = document.activeElement; let fid = null, s0 = null, s1 = null;
  if (a && a.id && app.contains(a)){ fid = a.id; try { s0 = a.selectionStart; s1 = a.selectionEnd; } catch (_){ } }
  app.innerHTML = layout(currentView());
  if (fid){ const n = document.getElementById(fid); if (n){ try { n.focus({preventScroll:true}); if (s0 != null && n.setSelectionRange) n.setSelectionRange(s0, s1); } catch (_){ } } }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || !document.getElementById('app').contains(t)) return;
  const fn = A[t.dataset.act]; if (!fn) return;
  if (t.tagName === 'A') e.preventDefault();
  fn(t.dataset, t, e);
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset || !f.dataset.form) return;
  e.preventDefault();
  const h = FORMS[f.dataset.form]; if (h) run(() => h(f));
});
document.addEventListener('input', e => { const t = e.target; if (t.form && t.form.dataset.key) capture(t.form); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'b-terms'){ S.ui.terms = t.checked; render(); return; }
  if (t.name === 'wm'){ if (t.form) capture(t.form); render(); return; }
  if (t.id === 'a-type'){ const m = document.getElementById('a-max'); const T = TYPES[t.value]; if (m && T){ m.value = T.max; m.max = T.max; m.min = t.value === 'grp' ? 6 : t.value === 'duo' ? 2 : 1; } }
  if (t.form && t.form.dataset.key) capture(t.form);
});
window.addEventListener('hashchange', () => { S.route = parseRoute(); if (!S.keepFlash) S.flash = null; S.keepFlash = false; render(); window.scrollTo(0, 0); });

/* ---------- Start ---------- */
async function boot(){
  S.route = parseRoute();
  render();
  const timer = setTimeout(() => { if (!S.fresh){ S.slow = true; render(); } }, 10000);
  try { await B.init(); }
  catch (e){ console.warn(e); S.err = 'init'; S.ready = true; S.loaded = {s:true, t:true, f:true}; }
  clearTimeout(timer);
  render();
}
boot();
})();
</script>
